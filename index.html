<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>md2pdf — Markdown to PDF</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text2: #8b949e;
    --accent: #58a6ff;
    --accent2: #1f6feb;
    --btn-bg: #238636;
    --btn-hover: #2ea043;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --mono: 'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
  }

  header h1 span { color: var(--accent); }

  header .actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .btn {
    padding: 7px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    font-family: var(--font);
    transition: all 0.15s;
    white-space: nowrap;
  }

  .btn:hover { background: #21262d; }

  .btn-primary {
    background: var(--btn-bg);
    border-color: rgba(240,246,252,0.1);
    color: #fff;
    font-weight: 500;
  }

  .btn-primary:hover { background: var(--btn-hover); }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .status {
    font-size: 12px;
    color: var(--text2);
    margin-right: 12px;
    transition: opacity 0.3s;
  }

  .status.ok { color: #3fb950; }
  .status.err { color: #f85149; }

  /* Main layout */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .pane:first-child { border-right: 1px solid var(--border); }

  .pane-header {
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  /* Editor */
  #editor {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: none;
    padding: 20px;
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.6;
    resize: none;
    outline: none;
    tab-size: 2;
  }

  #editor::placeholder {
    color: #484f58;
  }

  /* Preview */
  #preview {
    flex: 1;
    padding: 20px 28px;
    overflow-y: auto;
    line-height: 1.7;
    font-size: 15px;
  }

  /* GitHub-flavored markdown styling */
  #preview h1, #preview h2, #preview h3, #preview h4 {
    margin-top: 24px;
    margin-bottom: 12px;
    font-weight: 600;
    line-height: 1.25;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }

  #preview h1 { font-size: 2em; }
  #preview h2 { font-size: 1.5em; }
  #preview h3 { font-size: 1.25em; }

  #preview p { margin-bottom: 12px; }

  #preview a { color: var(--accent); text-decoration: none; }
  #preview a:hover { text-decoration: underline; }

  #preview code {
    background: #161b22;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 0.9em;
  }

  #preview pre {
    background: #161b22;
    padding: 16px;
    border-radius: 6px;
    overflow-x: auto;
    margin-bottom: 16px;
    border: 1px solid var(--border);
  }

  #preview pre code {
    background: none;
    padding: 0;
    font-size: 13px;
  }

  #preview blockquote {
    border-left: 3px solid var(--accent);
    padding: 4px 16px;
    margin: 12px 0;
    color: var(--text2);
  }

  #preview table {
    border-collapse: collapse;
    width: 100%;
    margin-bottom: 16px;
  }

  #preview th, #preview td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
  }

  #preview th { background: var(--bg2); font-weight: 600; }

  #preview img { max-width: 100%; border-radius: 6px; }

  #preview ul, #preview ol { padding-left: 24px; margin-bottom: 12px; }
  #preview li { margin-bottom: 4px; }

  #preview hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 24px 0;
  }

  .placeholder-text {
    color: var(--text2);
    text-align: center;
    margin-top: 100px;
    font-size: 14px;
  }

  .placeholder-text .icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.3;
  }

  /* Spinner */
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--text);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Responsive */
  @media (max-width: 768px) {
    .main { flex-direction: column; }
    .pane:first-child { border-right: none; border-bottom: 1px solid var(--border); }
    .pane { height: 50%; }
  }
</style>
</head>
<body>

<header>
  <h1>md<span>2</span>pdf</h1>
  <div class="actions">
    <span id="status" class="status"></span>
    <button class="btn" onclick="loadSample()" title="Load sample markdown">Sample</button>
    <button class="btn" onclick="clearEditor()" title="Clear editor">Clear</button>
    <button id="downloadBtn" class="btn btn-primary" onclick="downloadPDF()">
      Download PDF
    </button>
  </div>
</header>

<div class="main">
  <div class="pane">
    <div class="pane-header">Markdown</div>
    <textarea id="editor" placeholder="# Start typing markdown here...

## Or paste your content

- Lists work
- **Bold** and *italic*

> Blockquotes
" rows="20"></textarea>
  </div>
  <div class="pane">
    <div class="pane-header">Preview</div>
    <div id="preview">
      <div class="placeholder-text">
        <div class="icon">📄</div>
        Start typing on the left to see a live preview
      </div>
    </div>
  </div>
</div>

<script>
const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
const status = document.getElementById('status');
const downloadBtn = document.getElementById('downloadBtn');

// Live preview
let debounceTimer;
editor.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(updatePreview, 150);
});

function updatePreview() {
  const md = editor.value.trim();
  if (!md) {
    preview.innerHTML = '<div class="placeholder-text"><div class="icon">📄</div>Start typing on the left to see a live preview</div>';
    return;
  }
  try {
    preview.innerHTML = marked.parse(md);
  } catch (e) {
    preview.innerHTML = '<div class="placeholder-text"><div class="icon">⚠️</div>Error rendering preview</div>';
  }
}

// Download PDF
async function downloadPDF() {
  const md = editor.value.trim();
  if (!md) {
    setStatus('Nothing to convert', 'err');
    return;
  }

  downloadBtn.disabled = true;
  downloadBtn.innerHTML = '<span class="spinner"></span>Converting...';
  setStatus('Converting...', '');

  try {
    const response = await fetch('/convert', {
      method: 'POST',
      body: md,
    });

    if (!response.ok) {
      throw new Error(await response.text());
    }

    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    
    // Get filename from header or default
    const disposition = response.headers.get('content-disposition');
    let filename = 'document.pdf';
    if (disposition) {
      const match = disposition.match(/filename="?([^"]+)"?/);
      if (match) filename = match[1];
    }

    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    const kb = (blob.size / 1024).toFixed(1);
    setStatus(`Done — ${kb} KB`, 'ok');
  } catch (e) {
    setStatus('Conversion failed', 'err');
    console.error(e);
  } finally {
    downloadBtn.disabled = false;
    downloadBtn.textContent = 'Download PDF';
  }
}

function setStatus(msg, cls) {
  status.textContent = msg;
  status.className = 'status ' + cls;
  if (cls === 'ok' || cls === 'err') {
    setTimeout(() => { status.textContent = ''; status.className = 'status'; }, 3000);
  }
}

function clearEditor() {
  editor.value = '';
  updatePreview();
  editor.focus();
  setStatus('', '');
}

function loadSample() {
  editor.value = `# Welcome to md2pdf

This is a **self-hosted** markdown to PDF converter.

## Features

- Live preview as you type
- GitHub-flavored markdown
- Download as PDF
- Runs on your own server

## Code Example

\`\`\`python
def hello():
    print("Hello, world!")
\`\`\`

## Blockquote

> The best way to predict the future is to invent it.
> — Alan Kay

## Table

| Feature | Status |
|---------|--------|
| Markdown | ✅ |
| PDF Export | ✅ |
| Dark Mode | ✅ |
| Self-Hosted | ✅ |

---

Made with ❤️ on a VPS
`;
  updatePreview();
  setStatus('Sample loaded', 'ok');
}

// Keyboard shortcut: Ctrl+Enter to download
editor.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    downloadPDF();
  }
});

// Load sample on first visit if empty
if (!editor.value.trim()) {
  loadSample();
}
</script>

</body>
</html>
